name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:   # fast: lint, unit tests without a database, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make setup
      - run: make lint
      - run: make test
      - run: npm --prefix web run build

  warehouse:   # end to end: seed -> dbt build + tests -> detectors -> DB-backed tests -> eval -> browser smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: channelpulse
          POSTGRES_PASSWORD: channelpulse
          POSTGRES_DB: channelpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U channelpulse" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
      # No model credential, ever: paid calls are opt-in (make eval locally). Here the eval only validates its goldens.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make setup
      - run: make seed
      - run: make dbt
      - run: make test   # now with the database: the DB-marked tests run instead of skipping
      - run: make eval
      - name: Serve the API and a production build of the dashboard
        run: |
          nohup .venv/bin/python -m uvicorn app.main:app --app-dir api --port 8000 > api.log 2>&1 &
          npm --prefix web run build
          (cd web && nohup npx next start -p 3000 > ../web.log 2>&1 &)
          timeout 90 sh -c 'until curl -sf http://127.0.0.1:8000/health && curl -sf -o /dev/null http://127.0.0.1:3000/ask; do sleep 1; done'
      - run: cd web && npx playwright install --with-deps chromium
      - run: make smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: |
            evals/results/latest.json
            detectors/results/latest.json
            api.log
            web.log
            web/test-results/
