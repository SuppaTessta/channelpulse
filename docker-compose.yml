# Postgres for local dev. The api service only exists to exercise the deploy
# image: `docker compose --profile api up --build`. Day-to-day dev runs from .venv.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-channelpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-channelpulse}
      POSTGRES_DB: ${POSTGRES_DB:-channelpulse}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    profiles: ["api"]
    build: ./api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-channelpulse}:${POSTGRES_PASSWORD:-channelpulse}@postgres:5432/${POSTGRES_DB:-channelpulse}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
