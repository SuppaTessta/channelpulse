  # ---------------------------------------------------------------- ambiguous_clarify
  # The right answer is a question back. Each reading is one way to take the question, with its own hand-written
  # golden SQL returning what an answer under that reading would state; the free tier checks that the readings
  # really disagree, so each question is ambiguous in fact, not just in wording.
  - id: AC01
    category: ambiguous_clarify
    question: What were our sales last year?
    expected_label: needs_clarification
    readings:
      - reading: sell-in (primary), FY26 April 2025 to March 2026
        golden_sql: select sum(qty * unit_price_inr) as sales from marts.fct_primary_sales where invoice_date between '2025-04-01' and '2026-03-31'
      - reading: sell-in (primary), calendar 2025
        golden_sql: select sum(qty * unit_price_inr) as sales from marts.fct_primary_sales where invoice_date between '2025-01-01' and '2025-12-31'
      - reading: sell-out (secondary), FY26
        golden_sql: select sum(s.qty * p.list_price_inr) as sales from marts.fct_secondary_sales as s join marts.dim_product as p on p.sku = s.sku where s.sale_date between '2025-04-01' and '2026-03-31'
    compare: {type: clarify}

