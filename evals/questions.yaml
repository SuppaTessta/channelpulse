  - id: MH08
    category: multi_hop_why
    question: Which distributor had the weakest health score in the week starting Monday 14 September 2026, and what is dragging it down?
    expected_label: governed_metric
    # The weakest component is the largest weighted shortfall from 100 (weights as documented in the health score).
    # Each component value lists the words an answer may use for it.
    golden_sql: |
      with worst as (
          select *
          from marts.mart_distributor_health_weekly
          where week_start = '2026-09-14' and health_score is not null
          order by health_score, distributor_id
          limit 1
      ),
      components as (
          select w.distributor_id, w.health_score, c.component, c.shortfall
          from worst as w
          cross join lateral (values
              ('sell-out|sell out|secondary', 0.35 * (100 - w.score_secondary_trend)),
              ('sell-in|primary|gap', 0.20 * (100 - w.score_primary_secondary_gap)),
              ('days of stock|stock', 0.15 * (100 - w.score_days_of_stock_dev)),
              ('dso|collection|payment', 0.20 * (100 - w.score_dso_trend)),
              ('visit', 0.10 * (100 - w.score_visit_recency))
          ) as c (component, shortfall)
      )
      select c.distributor_id, d.distributor_name, c.health_score, c.component as weakest_component, c.shortfall
      from components as c
      join marts.dim_distributor as d on d.distributor_id = c.distributor_id
      order by c.shortfall desc
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [distributor_id, distributor_name]
        - golden: [weakest_component]
      evidence_tools: [[query_metric, run_readonly_sql]]

  - id: MH09
