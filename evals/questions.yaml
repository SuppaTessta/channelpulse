  # ---------------------------------------------------------------- filtered_grouped
  - id: FG01
    category: filtered_grouped
    question: Break down FY26 primary sales value by sales region.
    expected_label: governed_metric
    golden_sql: |
      select d.region, sum(f.qty * f.unit_price_inr) as primary_sales_value
      from marts.fct_primary_sales as f
      join marts.dim_distributor as d on d.distributor_id = f.distributor_id
      where f.invoice_date between '2025-04-01' and '2026-03-31'
      group by d.region
      order by d.region
    governed_call:
      - {metric_name: primary_sales_value, group_by: [distributor__region], date_range: {start: 2025-04-01, end: 2026-03-31}}
    compare: {type: keyed, keys: [region], values: [primary_sales_value], tolerance_rel: 0.005, allow_extra_keys: false}

