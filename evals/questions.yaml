      select s.distributor_id, d.distributor_name,
             sum(s.qty) filter (where s.sale_date between '2026-04-01' and '2026-06-30') as q1_fy27_units,
             sum(s.qty) filter (where s.sale_date between '2025-04-01' and '2025-06-30') as q1_fy26_units,
             coalesce(sum(s.qty) filter (where s.sale_date between '2026-04-01' and '2026-06-30'), 0)
             - coalesce(sum(s.qty) filter (where s.sale_date between '2025-04-01' and '2025-06-30'), 0) as unit_increase
      from marts.fct_secondary_sales as s
      join marts.dim_distributor as d on d.distributor_id = s.distributor_id
