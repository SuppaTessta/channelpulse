             sum(units_registered_within_90d)::numeric / sum(units_shipped_90d_matured) as registration_rate
      from marts.dim_batch
      where mfg_date between '2025-04-01' and '2026-03-31'
      group by plant_id, plant_name
      having sum(units_shipped_90d_matured) > 0
      order by plant_id
    governed_call:
      - {metric_name: warranty_registration_rate, group_by: [batch__plant_id], date_range: {start: 2025-04-01, end: 2026-03-31}}
    compare: {type: keyed, keys: [[plant_id, plant_name]], values: [registration_rate], tolerance_rel: 0.005, allow_extra_keys: false}

