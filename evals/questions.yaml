  - id: MH03
    category: multi_hop_why
    question: Which district has the most installer-attributed warranty claims, and why are claims there so high? Is a bad production batch to blame?
    expected_label: governed_metric
    # In that district, the installer (at least 50 installs) whose claim rate is highest against the rest of the
    # district's installers (leave-one-out ratio).
    golden_sql: |
      with installers as (
          select install_district, installer_id, installer_name,
                 sum(units_installed) filter (where months_since_install = 0) as installs,
                 sum(claims) as claims
          from marts.mart_installer_claim_cohorts
          group by install_district, installer_id, installer_name
      ),
      districts as (
          select install_district, sum(installs) as installs, sum(claims) as claims
          from installers
          group by install_district
      ),
      top_district as (
          select install_district from districts order by claims desc, install_district limit 1
      )
      select i.install_district, i.installer_id, i.installer_name, i.installs, i.claims,
             (i.claims::numeric / i.installs)
             / nullif((d.claims - i.claims)::numeric / nullif(d.installs - i.installs, 0), 0) as leave_one_out_ratio
      from installers as i
      join districts as d on d.install_district = i.install_district
      where i.install_district = (select install_district from top_district) and i.installs >= 50
      order by leave_one_out_ratio desc nulls last, i.installer_id
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [install_district]
        - golden: [installer_id, installer_name]
      must_not_mention:   # attributing an installer problem to production
        - '\b(caused|driven|explained)\s+by\s+(a\s+|the\s+|one\s+|bad\s+|faulty\s+|defective\s+)*(production\s+)?(batch|batches|resin\s+lots?|lots?)\b'
        - '\b(bad|faulty|defective)\s+(production\s+)?(batch|batches|resin\s+lots?)\b'
        - '\b(batch|resin\s+lot)\s+(is|was)\s+(to\s+blame|responsible)\b'
      evidence_tools: [get_anomalies]

