  - id: FG03
    category: filtered_grouped
    question: Which five distributors had the highest DSO on invoices raised in FY26?
    expected_label: governed_metric
    golden_sql: |
      with as_of as (select max(date_day) as d from marts.dim_date)
      select c.distributor_id, d.distributor_name,
             sum(c.invoice_amount_inr * (coalesce(c.fully_paid_date, as_of.d) - c.invoice_date))
             / sum(c.invoice_amount_inr) as dso_days
      from marts.fct_invoice_collections as c
      join marts.dim_distributor as d on d.distributor_id = c.distributor_id
      cross join as_of
      where c.invoice_date between '2025-04-01' and '2026-03-31'
      group by c.distributor_id, d.distributor_name
      order by dso_days desc, c.distributor_id
      limit 5
    # query_metric has no LIMIT, so the governed answer lists every distributor, largest first.
    governed_call:
      - {metric_name: dso, group_by: [distributor], date_range: {start: 2025-04-01, end: 2026-03-31}}
    compare: {type: keyed, keys: [[distributor_id, distributor_name]], values: [dso_days], tolerance_rel: 0.005, allow_extra_keys: true}

  - id: FG04
    category: filtered_grouped
    question: Compare warranty claims per 1,000 units shipped across our three plants, for tanks manufactured in FY25.
    expected_label: governed_metric
    golden_sql: |
      with units as (
          select plant_id, plant_name, sum(units_shipped) as shipped
          from marts.dim_batch
          where not is_legacy and mfg_date between '2024-04-01' and '2025-03-31'
          group by plant_id, plant_name
      ),
      claims as (
          select plant_id, count(*) as claims
          from marts.fct_warranty_claims
          where not is_legacy and ship_date is not null and mfg_date between '2024-04-01' and '2025-03-31'
          group by plant_id
      )
      select u.plant_id, u.plant_name, 1000.0 * c.claims / u.shipped as claims_per_1000_units
      from units as u
      join claims as c on c.plant_id = u.plant_id
      where u.shipped > 0
      order by u.plant_id
    governed_call:
      - {metric_name: claims_per_1000_units, filters: [{dimension: batch__is_legacy, op: '=', value: false}], group_by: [batch__plant_id], date_range: {start: 2024-04-01, end: 2025-03-31}}
    compare: {type: keyed, keys: [[plant_id, plant_name]], values: [claims_per_1000_units], tolerance_rel: 0.005, allow_extra_keys: false}

