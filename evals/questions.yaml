  - id: TC03
    category: time_comparison
    question: How did DSO on invoices raised in Q1 FY27 (April to June 2026) compare with invoices raised in Q4 FY26 (January to March 2026)?
    expected_label: governed_metric
    golden_sql: |
      with as_of as (select max(date_day) as d from marts.dim_date),
      invoices as (
          select c.invoice_date, c.invoice_amount_inr,
                 coalesce(c.fully_paid_date, as_of.d) - c.invoice_date as days_outstanding
          from marts.fct_invoice_collections as c, as_of
      )
      select sum(invoice_amount_inr * days_outstanding) filter (where invoice_date between '2026-01-01' and '2026-03-31')
             / sum(invoice_amount_inr) filter (where invoice_date between '2026-01-01' and '2026-03-31') as q4_fy26,
             sum(invoice_amount_inr * days_outstanding) filter (where invoice_date between '2026-04-01' and '2026-06-30')
