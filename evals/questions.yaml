      from marts.fct_channel_inventory_daily
      where date_day between '2026-03-30' and '2026-06-28'
    governed_call:
      - {metric_name: overstock_rate, date_range: {start: 2026-03-30, end: 2026-06-28}}
    compare: {type: scalar, tolerance_rel: 0.005}

