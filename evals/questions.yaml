# ChannelPulse golden set v1 (PLAN §10): 40 questions, 8 in each of 5 categories.
#
# Golden answers come only from the hand-written golden_sql below, run against marts.* at eval time. None of them
# was taken from the semantic layer's compiled SQL, from the agent, or from the generator's answer key, and no
# answer value (id, name, number) is hard-coded here: rubric terms are read from the golden result.
#
# compare:
#   scalar  golden_sql returns one row; every column is a number that must appear in the agent's evidence data.
#   keyed   golden rows are keys -> values. Every golden key must be present in the agent's evidence with each value
#           within tolerance. A key entry may be a list of golden columns, any of which may match (id or name).
#           Agent columns are matched by value, never by name. allow_extra_keys says whether other keys may appear.
#   rubric  golden_sql returns one row. must_mention items must appear in the answer text: `golden` names golden
#           columns (any of their values; a value may list alternatives separated by |), `any_of` lists literal
#           terms. must_not_mention holds regexes for claims the answer must not make (a sentence that negates
#           them, "not a batch problem", doesn't count). evidence_tools must have been called (a list = any of).
#   refusal the agent must refuse. Traps have no golden_sql.
# Tolerances are relative. Ad-hoc questions allow 1% because the agent's own SQL may round.

as_of: 2026-09-23   # the pinned data as-of (decisions D14); every question uses explicit periods

questions:

  # ---------------------------------------------------------------- simple_lookup
  - id: SL01
    category: simple_lookup
    question: What was our total primary sales value (sell-in to distributors) in Q1 FY27, April to June 2026?
    expected_label: governed_metric
    golden_sql: |
      select sum(qty * unit_price_inr) as primary_sales_value
      from marts.fct_primary_sales
      where invoice_date between '2026-04-01' and '2026-06-30'
    compare: {type: scalar, tolerance_rel: 0.005}

  - id: SL02
    category: simple_lookup
    question: How much did distributors sell out to retailers, in rupees at list price, in FY25 (April 2024 to March 2025)?
    expected_label: governed_metric
    golden_sql: |
      select sum(s.qty * p.list_price_inr) as secondary_sales_value
      from marts.fct_secondary_sales as s
      join marts.dim_product as p on p.sku = s.sku
      where s.sale_date between '2024-04-01' and '2025-03-31'
    compare: {type: scalar, tolerance_rel: 0.005}

  - id: SL03
    category: simple_lookup
    question: What was the company-wide DSO on invoices raised in FY26 (April 2025 to March 2026)?
    expected_label: governed_metric
    golden_sql: |
      with as_of as (select max(date_day) as d from marts.dim_date)
      select sum(c.invoice_amount_inr * (coalesce(c.fully_paid_date, as_of.d) - c.invoice_date))
             / sum(c.invoice_amount_inr) as dso_days
      from marts.fct_invoice_collections as c, as_of
      where c.invoice_date between '2025-04-01' and '2026-03-31'
    compare: {type: scalar, tolerance_rel: 0.005}

  - id: SL04
    category: simple_lookup
    question: For invoices raised in FY26, what share of the amount due was collected within payment terms (collections efficiency)?
    expected_label: governed_metric
    golden_sql: |
      select sum(paid_within_terms_inr) / sum(invoice_amount_inr) as collections_efficiency
      from marts.fct_invoice_collections
      where invoice_date between '2025-04-01' and '2026-03-31'
        and due_date <= (select max(date_day) from marts.dim_date)
    compare: {type: scalar, tolerance_rel: 0.005}

  - id: SL05
    category: simple_lookup
    question: How many days of stock did the channel hold overall, across all distributors and SKUs, in the week of Monday 14 September 2026?
    expected_label: governed_metric
    # The stock snapshot for a week is its last day, Sunday 2026-09-20.
    golden_sql: |
      select sum(stock_units)::numeric / sum(avg_daily_secondary_units) as channel_days_of_stock
      from marts.fct_channel_inventory_daily
      where date_day = '2026-09-20' and days_of_stock is not null
    compare: {type: scalar, tolerance_rel: 0.005}

  - id: SL06
    category: simple_lookup
    question: What is the warranty claim rate per 1,000 units shipped for tanks manufactured in calendar year 2024?
    expected_label: governed_metric
    golden_sql: |
      with units as (
          select sum(units_shipped) as shipped
          from marts.dim_batch
          where not is_legacy and mfg_date between '2024-01-01' and '2024-12-31'
      ),
      claims as (
          select count(*) as claims
          from marts.fct_warranty_claims
          where not is_legacy and ship_date is not null and mfg_date between '2024-01-01' and '2024-12-31'
      )
      select 1000.0 * claims.claims / units.shipped as claims_per_1000_units
      from units, claims
    compare: {type: scalar, tolerance_rel: 0.005}

  - id: SL07
    category: simple_lookup
    question: What was the channel overstock rate, the share of distributor-SKU-days above 60 days of stock, over the 13 weeks from Monday 30 March to Sunday 28 June 2026?
    expected_label: governed_metric
    golden_sql: |
      select count(*) filter (where is_overstock)::numeric / count(days_of_stock) as overstock_rate
      from marts.fct_channel_inventory_daily
      where date_day between '2026-03-30' and '2026-06-28'
    compare: {type: scalar, tolerance_rel: 0.005}

  - id: SL08
    category: simple_lookup
    question: On average, how many days after the sale do distributors report their sell-out? Use the gap between sale date and reported date across all secondary sales records with a sale date in FY26.
    expected_label: ad_hoc_sql_verify   # no governed metric measures reporting lag
    golden_sql: |
      select avg(reported_date - sale_date) as avg_reporting_lag_days
      from marts.fct_secondary_sales
      where sale_date between '2025-04-01' and '2026-03-31'
    compare: {type: scalar, tolerance_rel: 0.01}

  # ---------------------------------------------------------------- filtered_grouped
  - id: FG01
    category: filtered_grouped
    question: Break down FY26 primary sales value by sales region.
    expected_label: governed_metric
    golden_sql: |
      select d.region, sum(f.qty * f.unit_price_inr) as primary_sales_value
      from marts.fct_primary_sales as f
      join marts.dim_distributor as d on d.distributor_id = f.distributor_id
      where f.invoice_date between '2025-04-01' and '2026-03-31'
      group by d.region
      order by d.region
    compare: {type: keyed, keys: [region], values: [primary_sales_value], tolerance_rel: 0.005, allow_extra_keys: false}

  - id: FG02
    category: filtered_grouped
    question: What was secondary sales value by product category in FY26?
    expected_label: governed_metric
    golden_sql: |
      select p.category, sum(s.qty * p.list_price_inr) as secondary_sales_value
      from marts.fct_secondary_sales as s
      join marts.dim_product as p on p.sku = s.sku
      where s.sale_date between '2025-04-01' and '2026-03-31'
      group by p.category
      order by p.category
    compare: {type: keyed, keys: [category], values: [secondary_sales_value], tolerance_rel: 0.005, allow_extra_keys: false}

  - id: FG03
    category: filtered_grouped
    question: Which five distributors had the highest DSO on invoices raised in FY26?
    expected_label: governed_metric
    golden_sql: |
      with as_of as (select max(date_day) as d from marts.dim_date)
      select c.distributor_id, d.distributor_name,
             sum(c.invoice_amount_inr * (coalesce(c.fully_paid_date, as_of.d) - c.invoice_date))
             / sum(c.invoice_amount_inr) as dso_days
      from marts.fct_invoice_collections as c
      join marts.dim_distributor as d on d.distributor_id = c.distributor_id
      cross join as_of
      where c.invoice_date between '2025-04-01' and '2026-03-31'
      group by c.distributor_id, d.distributor_name
      order by dso_days desc, c.distributor_id
      limit 5
    # query_metric has no LIMIT, so the governed answer lists every distributor, largest first.
    compare: {type: keyed, keys: [[distributor_id, distributor_name]], values: [dso_days], tolerance_rel: 0.005, allow_extra_keys: true}

  - id: FG04
    category: filtered_grouped
    question: Compare warranty claims per 1,000 units shipped across our three plants, for tanks manufactured in FY25.
    expected_label: governed_metric
    golden_sql: |
      with units as (
          select plant_id, plant_name, sum(units_shipped) as shipped
          from marts.dim_batch
          where not is_legacy and mfg_date between '2024-04-01' and '2025-03-31'
          group by plant_id, plant_name
      ),
      claims as (
          select plant_id, count(*) as claims
          from marts.fct_warranty_claims
          where not is_legacy and ship_date is not null and mfg_date between '2024-04-01' and '2025-03-31'
          group by plant_id
      )
      select u.plant_id, u.plant_name, 1000.0 * c.claims / u.shipped as claims_per_1000_units
      from units as u
      join claims as c on c.plant_id = u.plant_id
      where u.shipped > 0
      order by u.plant_id
    compare: {type: keyed, keys: [[plant_id, plant_name]], values: [claims_per_1000_units], tolerance_rel: 0.005, allow_extra_keys: false}

  - id: FG05
    category: filtered_grouped
    question: How does collections efficiency on FY26 invoices differ by distributor tier?
    expected_label: governed_metric
    golden_sql: |
      select d.tier, sum(c.paid_within_terms_inr) / sum(c.invoice_amount_inr) as collections_efficiency
      from marts.fct_invoice_collections as c
      join marts.dim_distributor as d on d.distributor_id = c.distributor_id
      where c.invoice_date between '2025-04-01' and '2026-03-31'
        and c.due_date <= (select max(date_day) from marts.dim_date)
      group by d.tier
      order by d.tier
    compare: {type: keyed, keys: [tier], values: [collections_efficiency], tolerance_rel: 0.005, allow_extra_keys: false}

  - id: FG06
    category: filtered_grouped
    question: For tanks installed during calendar 2025, how does the installer claim rate per 1,000 installs compare between certified and non-certified installers?
    expected_label: governed_metric
    golden_sql: |
      select is_certified,
             1000.0 * sum(claims) / sum(units_installed) filter (where months_since_install = 0) as installer_claim_rate
      from marts.mart_installer_claim_cohorts
      where install_month between '2025-01-01' and '2025-12-31'
      group by is_certified
      order by is_certified
    compare: {type: keyed, keys: [is_certified], values: [installer_claim_rate], tolerance_rel: 0.005, allow_extra_keys: false}

  - id: FG07
    category: filtered_grouped
    question: What was the average distributor health score in each region for the week starting Monday 14 September 2026?
    expected_label: governed_metric
    golden_sql: |
      select region, avg(health_score) as distributor_health_score
      from marts.mart_distributor_health_weekly
      where week_start = '2026-09-14'
      group by region
      order by region
    compare: {type: keyed, keys: [region], values: [distributor_health_score], tolerance_rel: 0.005, allow_extra_keys: false}

  - id: FG08
    category: filtered_grouped
    question: How many retailers are on our books in each sales region, counting the retailers attached to each region's distributors?
    expected_label: ad_hoc_sql_verify   # no governed metric counts retailers
    golden_sql: |
      select region, sum(retailer_count) as retailers
      from marts.dim_distributor
      group by region
      order by region
    compare: {type: keyed, keys: [region], values: [retailers], tolerance_rel: 0.01, allow_extra_keys: false}

  # ---------------------------------------------------------------- time_comparison
  - id: TC01
    category: time_comparison
    question: How did total primary sales value in FY26 (April 2025 to March 2026) compare with FY25 (April 2024 to March 2025)?
    expected_label: governed_metric
    golden_sql: |
      select sum(qty * unit_price_inr) filter (where invoice_date between '2024-04-01' and '2025-03-31') as fy25,
             sum(qty * unit_price_inr) filter (where invoice_date between '2025-04-01' and '2026-03-31') as fy26
      from marts.fct_primary_sales
    compare: {type: scalar, tolerance_rel: 0.005}

  - id: TC02
    category: time_comparison
    question: Compare the average QC pass rate of production batches at each plant for batches made in FY26 versus FY25.
    expected_label: ad_hoc_sql_verify   # qc_pass_rate is in dim_batch, but no governed metric covers it
    golden_sql: |
      select plant_id, plant_name,
             avg(qc_pass_rate) filter (where mfg_date between '2024-04-01' and '2025-03-31') as fy25,
             avg(qc_pass_rate) filter (where mfg_date between '2025-04-01' and '2026-03-31') as fy26
      from marts.dim_batch
      group by plant_id, plant_name
      order by plant_id
    compare: {type: keyed, keys: [[plant_id, plant_name]], values: [fy25, fy26], tolerance_rel: 0.01, allow_extra_keys: false}

  - id: TC03
    category: time_comparison
    question: How did DSO on invoices raised in Q1 FY27 (April to June 2026) compare with invoices raised in Q4 FY26 (January to March 2026)?
    expected_label: governed_metric
    golden_sql: |
      with as_of as (select max(date_day) as d from marts.dim_date),
      invoices as (
          select c.invoice_date, c.invoice_amount_inr,
                 coalesce(c.fully_paid_date, as_of.d) - c.invoice_date as days_outstanding
          from marts.fct_invoice_collections as c, as_of
      )
      select sum(invoice_amount_inr * days_outstanding) filter (where invoice_date between '2026-01-01' and '2026-03-31')
             / sum(invoice_amount_inr) filter (where invoice_date between '2026-01-01' and '2026-03-31') as q4_fy26,
             sum(invoice_amount_inr * days_outstanding) filter (where invoice_date between '2026-04-01' and '2026-06-30')
             / sum(invoice_amount_inr) filter (where invoice_date between '2026-04-01' and '2026-06-30') as q1_fy27
      from invoices
    compare: {type: scalar, tolerance_rel: 0.005}

  - id: TC04
    category: time_comparison
    question: Month by month, how did secondary sales value in April to August 2026 compare with the same months of 2025?
    expected_label: governed_metric
    golden_sql: |
      select date_trunc('month', s.sale_date)::date as month, sum(s.qty * p.list_price_inr) as secondary_sales_value
      from marts.fct_secondary_sales as s
      join marts.dim_product as p on p.sku = s.sku
      where s.sale_date between '2025-04-01' and '2025-08-31'
         or s.sale_date between '2026-04-01' and '2026-08-31'
      group by 1
      order by 1
    # One query spanning April 2025 to August 2026 is a fair answer, so the months in between may appear.
    compare: {type: keyed, keys: [month], values: [secondary_sales_value], tolerance_rel: 0.005, allow_extra_keys: true}

  - id: TC05
    category: time_comparison
    question: How did the number of base-crack warranty claims filed at each plant in FY26 compare with FY25?
    expected_label: governed_metric
    golden_sql: |
      select b.plant_id, b.plant_name,
             count(*) filter (where c.claim_date between '2024-04-01' and '2025-03-31') as fy25,
             count(*) filter (where c.claim_date between '2025-04-01' and '2026-03-31') as fy26
      from marts.fct_warranty_claims as c
      join marts.dim_batch as b on b.batch_id = c.batch_id
      where c.failure_mode = 'base_crack'
      group by b.plant_id, b.plant_name
      order by b.plant_id
    compare: {type: keyed, keys: [[plant_id, plant_name]], values: [fy25, fy26], tolerance_rel: 0.005, allow_extra_keys: false}

  - id: TC06
    category: time_comparison
    question: By region, how did the channel stock-out rate over the 13 weeks from 29 December 2025 to 29 March 2026 compare with the 13 weeks from 22 June to 20 September 2026?
    expected_label: governed_metric
    golden_sql: |
      select d.region,
             count(*) filter (where i.is_stockout and i.date_day <= '2026-03-29')::numeric
             / count(i.days_of_stock) filter (where i.date_day <= '2026-03-29') as winter,
             count(*) filter (where i.is_stockout and i.date_day >= '2026-06-22')::numeric
             / count(i.days_of_stock) filter (where i.date_day >= '2026-06-22') as monsoon
      from marts.fct_channel_inventory_daily as i
      join marts.dim_distributor as d on d.distributor_id = i.distributor_id
      where i.date_day between '2025-12-29' and '2026-03-29'
         or i.date_day between '2026-06-22' and '2026-09-20'
      group by d.region
      order by d.region
    compare: {type: keyed, keys: [region], values: [winter, monsoon], tolerance_rel: 0.005, allow_extra_keys: false}

  - id: TC07
    category: time_comparison
    question: Has the warranty registration rate improved? Compare tanks manufactured in FY26 with tanks manufactured in FY25.
    expected_label: governed_metric
    golden_sql: |
      select sum(units_registered_within_90d) filter (where mfg_date between '2024-04-01' and '2025-03-31')::numeric
             / sum(units_shipped_90d_matured) filter (where mfg_date between '2024-04-01' and '2025-03-31') as fy25,
             sum(units_registered_within_90d) filter (where mfg_date between '2025-04-01' and '2026-03-31')::numeric
             / sum(units_shipped_90d_matured) filter (where mfg_date between '2025-04-01' and '2026-03-31') as fy26
      from marts.dim_batch
    compare: {type: scalar, tolerance_rel: 0.005}

  - id: TC08
    category: time_comparison
    question: Was quarter-end loading heavier at the Q4 FY26 scheme window than at the Q4 FY25 one? Give the average scheme concentration ratio for each.
    expected_label: governed_metric
    golden_sql: |
      select avg(concentration_ratio) filter (where fiscal_quarter_label = 'FY25Q4') as fy25_q4,
             avg(concentration_ratio) filter (where fiscal_quarter_label = 'FY26Q4') as fy26_q4
      from marts.mart_scheme_quarterly
    compare: {type: scalar, tolerance_rel: 0.005}

  # ---------------------------------------------------------------- multi_hop_why
  - id: MH01
    category: multi_hop_why
    question: Why did base-crack warranty claims rise at our Durgapur plant in 2025?
    expected_label: governed_metric
    # The resin lot with the highest base-crack claim rate among Durgapur's lots (at least 200 units shipped).
    golden_sql: |
      with lots as (
          select resin_lot_id, sum(units_shipped) as units_shipped
          from marts.dim_batch
          where plant_id = 'DGP' and not is_legacy
          group by resin_lot_id
      ),
      cracks as (
          select resin_lot_id, count(*) as base_crack_claims
          from marts.fct_warranty_claims
          where plant_id = 'DGP' and failure_mode = 'base_crack' and not is_legacy
          group by resin_lot_id
      )
      select l.resin_lot_id, l.units_shipped, c.base_crack_claims,
             1000.0 * c.base_crack_claims / l.units_shipped as base_crack_per_1000
      from lots as l
      join cracks as c on c.resin_lot_id = l.resin_lot_id
      where l.units_shipped >= 200
      order by base_crack_per_1000 desc, l.resin_lot_id
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [resin_lot_id]
      must_not_mention:   # blaming the channel for a manufacturing defect
        - '\b(caused|driven|explained)\s+by\s+(the\s+|a\s+|one\s+|certain\s+|some\s+)?distributors?\b'
        - '\bdistributors?\W+(handling|mishandling|storage|stacking|transport)\b'
        - '\b(mishandl\w*|poor\s+handling|rough\s+handling)\b.{0,40}\bdistributors?\b'
      evidence_tools: [get_anomalies]

  - id: MH02
    category: multi_hop_why
    question: As of 23 September 2026, which distributor shows the clearest channel stress, with sell-out falling while sell-in holds up, and what is behind it?
    expected_label: governed_metric
    # Health, sell-out trend and collections: of the distributors at risk in the latest complete health week, the one
    # whose Jun-Aug 2026 secondary units fell most against Jun-Aug 2025 while its primary units held at >= 90%.
    golden_sql: |
      with at_risk as (
          select distributor_id, health_score, dso_vs_median
          from marts.mart_distributor_health_weekly
          where week_start = '2026-09-14' and is_at_risk
      ),
      sell_out as (
          select distributor_id,
                 sum(qty) filter (where sale_date between '2026-06-01' and '2026-08-31') as units_now,
                 sum(qty) filter (where sale_date between '2025-06-01' and '2025-08-31') as units_last_year
          from marts.fct_secondary_sales
          group by distributor_id
      ),
      sell_in as (
          select distributor_id,
                 sum(qty) filter (where invoice_date between '2026-06-01' and '2026-08-31') as units_now,
                 sum(qty) filter (where invoice_date between '2025-06-01' and '2025-08-31') as units_last_year
          from marts.fct_primary_sales
          group by distributor_id
      )
      select d.distributor_id, d.distributor_name, d.region, r.health_score, r.dso_vs_median,
             so.units_now::numeric / so.units_last_year as sell_out_vs_last_year,
             si.units_now::numeric / si.units_last_year as sell_in_vs_last_year
      from at_risk as r
      join marts.dim_distributor as d on d.distributor_id = r.distributor_id
      join sell_out as so on so.distributor_id = r.distributor_id
      join sell_in as si on si.distributor_id = r.distributor_id
      where so.units_last_year > 0 and si.units_now >= 0.9 * si.units_last_year
      order by sell_out_vs_last_year, d.distributor_id
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [distributor_id, distributor_name]
        - any_of: [sell-out, sell out, secondary]
      evidence_tools: [get_anomalies]

  - id: MH03
    category: multi_hop_why
    question: Which district has the most installer-attributed warranty claims, and why are claims there so high? Is a bad production batch to blame?
    expected_label: governed_metric
    # In that district, the installer (at least 50 installs) whose claim rate is highest against the rest of the
    # district's installers (leave-one-out ratio).
    golden_sql: |
      with installers as (
          select install_district, installer_id, installer_name,
                 sum(units_installed) filter (where months_since_install = 0) as installs,
                 sum(claims) as claims
          from marts.mart_installer_claim_cohorts
          group by install_district, installer_id, installer_name
      ),
      districts as (
          select install_district, sum(installs) as installs, sum(claims) as claims
          from installers
          group by install_district
      ),
      top_district as (
          select install_district from districts order by claims desc, install_district limit 1
      )
      select i.install_district, i.installer_id, i.installer_name, i.installs, i.claims,
             (i.claims::numeric / i.installs)
             / nullif((d.claims - i.claims)::numeric / nullif(d.installs - i.installs, 0), 0) as leave_one_out_ratio
      from installers as i
      join districts as d on d.install_district = i.install_district
      where i.install_district = (select install_district from top_district) and i.installs >= 50
      order by leave_one_out_ratio desc nulls last, i.installer_id
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [install_district]
        - golden: [installer_id, installer_name]
      must_not_mention:   # attributing an installer problem to production
        - '\b(caused|driven|explained)\s+by\s+(a\s+|the\s+|one\s+|bad\s+|faulty\s+|defective\s+)*(production\s+)?(batch|batches|resin\s+lots?|lots?)\b'
        - '\b(bad|faulty|defective)\s+(production\s+)?(batch|batches|resin\s+lots?)\b'
        - '\b(batch|resin\s+lot)\s+(is|was)\s+(to\s+blame|responsible)\b'
      evidence_tools: [get_anomalies]

  - id: MH04
    category: multi_hop_why
    question: Why does channel stock tend to rise right after each quarter-end?
    expected_label: governed_metric
    # Share of each quarter's primary volume booked in its 15-day scheme window, over complete windows (15/91 of the
    # days), and the mean change in days of stock over the 60 days after quarter-end.
    golden_sql: |
      select sum(window_units)::numeric / sum(quarter_units) as scheme_window_share,
             avg(dos_excess_60d) as avg_days_of_stock_rise_60d,
             count(distinct fiscal_quarter_label) as quarters
      from marts.mart_scheme_quarterly
      where is_window_complete
    compare:
      type: rubric
      must_mention:
        - any_of: [scheme, quarter-end, quarter end]
      evidence_tools: [[query_metric, run_readonly_sql]]

  - id: MH05
    category: multi_hop_why
    question: Warranty claim costs were higher in FY26 than in FY25. What drove the increase?
    expected_label: governed_metric
    golden_sql: |
      select failure_mode,
             sum(cost_inr) filter (where claim_date between '2025-04-01' and '2026-03-31')
             - sum(cost_inr) filter (where claim_date between '2024-04-01' and '2025-03-31') as cost_increase_inr
      from marts.fct_warranty_claims
      group by failure_mode
      order by cost_increase_inr desc nulls last
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [failure_mode]
      evidence_tools: [[query_metric, run_readonly_sql]]

  - id: MH06
    category: multi_hop_why
    question: As of 23 September 2026, which distributor owes us the most overdue money, and why has it built up?
    expected_label: governed_metric
    golden_sql: |
      select c.distributor_id, d.distributor_name, sum(c.open_amount_inr) as overdue_inr
      from marts.fct_invoice_collections as c
      join marts.dim_distributor as d on d.distributor_id = c.distributor_id
      where c.is_open and c.due_date < (select max(date_day) from marts.dim_date)
      group by c.distributor_id, d.distributor_name
      order by overdue_inr desc, c.distributor_id
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [distributor_id, distributor_name]
      evidence_tools: [[query_metric, run_readonly_sql]]

  - id: MH07
    category: multi_hop_why
    question: Sell-out in Assam jumped in Q1 FY27 (April to June 2026) compared with Q1 FY26. Which distributor drove most of that growth, and what was behind it?
    expected_label: governed_metric
    # The Assam distributor with the largest rise in secondary units (it leads on value too).
    golden_sql: |
      select s.distributor_id, d.distributor_name,
             sum(s.qty) filter (where s.sale_date between '2026-04-01' and '2026-06-30') as q1_fy27_units,
             sum(s.qty) filter (where s.sale_date between '2025-04-01' and '2025-06-30') as q1_fy26_units,
             coalesce(sum(s.qty) filter (where s.sale_date between '2026-04-01' and '2026-06-30'), 0)
             - coalesce(sum(s.qty) filter (where s.sale_date between '2025-04-01' and '2025-06-30'), 0) as unit_increase
      from marts.fct_secondary_sales as s
      join marts.dim_distributor as d on d.distributor_id = s.distributor_id
      where d.region = 'Assam'
        and (s.sale_date between '2025-04-01' and '2025-06-30' or s.sale_date between '2026-04-01' and '2026-06-30')
      group by s.distributor_id, d.distributor_name
      order by unit_increase desc, s.distributor_id
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [distributor_id, distributor_name]
      evidence_tools: [[query_metric, run_readonly_sql]]

  - id: MH08
    category: multi_hop_why
    question: Which distributor had the weakest health score in the week starting Monday 14 September 2026, and what is dragging it down?
    expected_label: governed_metric
    # The weakest component is the largest weighted shortfall from 100 (weights as documented in the health score).
    # Each component value lists the words an answer may use for it.
    golden_sql: |
      with worst as (
          select *
          from marts.mart_distributor_health_weekly
          where week_start = '2026-09-14' and health_score is not null
          order by health_score, distributor_id
          limit 1
      ),
      components as (
          select w.distributor_id, w.health_score, c.component, c.shortfall
          from worst as w
          cross join lateral (values
              ('sell-out|sell out|secondary', 0.35 * (100 - w.score_secondary_trend)),
              ('sell-in|primary|gap', 0.20 * (100 - w.score_primary_secondary_gap)),
              ('days of stock|stock', 0.15 * (100 - w.score_days_of_stock_dev)),
              ('dso|collection|payment', 0.20 * (100 - w.score_dso_trend)),
              ('visit', 0.10 * (100 - w.score_visit_recency))
          ) as c (component, shortfall)
      )
      select c.distributor_id, d.distributor_name, c.health_score, c.component as weakest_component, c.shortfall
      from components as c
      join marts.dim_distributor as d on d.distributor_id = c.distributor_id
      order by c.shortfall desc
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [distributor_id, distributor_name]
        - golden: [weakest_component]
      evidence_tools: [[query_metric, run_readonly_sql]]

