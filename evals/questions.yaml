          from marts.mart_scheme_quarterly
          where is_window_complete
          group by fiscal_quarter_label
          order by concentration desc, fiscal_quarter_label
          limit 1
      )
      select q.fiscal_quarter_label, s.region, avg(s.concentration_ratio) as region_concentration
      from quarters as q
      join marts.mart_scheme_quarterly as s on s.fiscal_quarter_label = q.fiscal_quarter_label
      group by q.fiscal_quarter_label, s.region
      order by region_concentration desc, s.region
      limit 1
    compare:
