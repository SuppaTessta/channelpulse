  # ---------------------------------------------------------------- multi_hop_why
  - id: MH01
    category: multi_hop_why
    question: Why did base-crack warranty claims rise at our Durgapur plant in 2025?
    expected_label: governed_metric
    # The resin lot with the highest base-crack claim rate among Durgapur's lots (at least 200 units shipped).
    golden_sql: |
      with lots as (
          select resin_lot_id, sum(units_shipped) as units_shipped
          from marts.dim_batch
          where plant_id = 'DGP' and not is_legacy
          group by resin_lot_id
      ),
      cracks as (
          select resin_lot_id, count(*) as base_crack_claims
          from marts.fct_warranty_claims
          where plant_id = 'DGP' and failure_mode = 'base_crack' and not is_legacy
          group by resin_lot_id
      )
      select l.resin_lot_id, l.units_shipped, c.base_crack_claims,
             1000.0 * c.base_crack_claims / l.units_shipped as base_crack_per_1000
      from lots as l
      join cracks as c on c.resin_lot_id = l.resin_lot_id
      where l.units_shipped >= 200
      order by base_crack_per_1000 desc, l.resin_lot_id
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [resin_lot_id]
      must_not_mention:   # blaming the channel for a manufacturing defect
        - '\b(caused|driven|explained)\s+by\s+(the\s+|a\s+|one\s+|certain\s+|some\s+)?distributors?\b'
        - '\bdistributors?\W+(handling|mishandling|storage|stacking|transport)\b'
        - '\b(mishandl\w*|poor\s+handling|rough\s+handling)\b.{0,40}\bdistributors?\b'
      evidence_tools: [get_anomalies]

  - id: MH02
    category: multi_hop_why
    question: As of 23 September 2026, which distributor shows the clearest channel stress, with sell-out falling while sell-in holds up, and what is behind it?
    expected_label: governed_metric
    # Health, sell-out trend and collections: of the distributors at risk in the latest complete health week, the one
    # whose Jun-Aug 2026 secondary units fell most against Jun-Aug 2025 while its primary units held at >= 90%.
    golden_sql: |
      with at_risk as (
          select distributor_id, health_score, dso_vs_median
          from marts.mart_distributor_health_weekly
          where week_start = '2026-09-14' and is_at_risk
      ),
      sell_out as (
          select distributor_id,
                 sum(qty) filter (where sale_date between '2026-06-01' and '2026-08-31') as units_now,
                 sum(qty) filter (where sale_date between '2025-06-01' and '2025-08-31') as units_last_year
          from marts.fct_secondary_sales
          group by distributor_id
      ),
      sell_in as (
          select distributor_id,
                 sum(qty) filter (where invoice_date between '2026-06-01' and '2026-08-31') as units_now,
                 sum(qty) filter (where invoice_date between '2025-06-01' and '2025-08-31') as units_last_year
          from marts.fct_primary_sales
          group by distributor_id
      )
      select d.distributor_id, d.distributor_name, d.region, r.health_score, r.dso_vs_median,
             so.units_now::numeric / so.units_last_year as sell_out_vs_last_year,
             si.units_now::numeric / si.units_last_year as sell_in_vs_last_year
      from at_risk as r
      join marts.dim_distributor as d on d.distributor_id = r.distributor_id
      join sell_out as so on so.distributor_id = r.distributor_id
      join sell_in as si on si.distributor_id = r.distributor_id
      where so.units_last_year > 0 and si.units_now >= 0.9 * si.units_last_year
      order by sell_out_vs_last_year, d.distributor_id
      limit 1
    compare:
      type: rubric
      must_mention:
        - golden: [distributor_id, distributor_name]
