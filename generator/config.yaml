    - [2024-04-01, [tank], 0.03]
    - [2025-04-01, [tank], 0.03]
    - [2026-04-01, [tank], 0.03]
    - [2024-04-01, [sanitaryware], 0.04]
    - [2025-04-01, [sanitaryware], 0.04]
    - [2026-04-01, [sanitaryware], 0.04]
    - [2023-11-06, [pipe, fitting], 0.04]
    - [2024-03-04, [pipe, fitting], -0.03]
    - [2024-07-01, [pipe, fitting], 0.05]
    - [2024-11-11, [pipe, fitting], -0.02]
    - [2025-03-10, [pipe, fitting], -0.04]
    - [2025-07-14, [pipe, fitting], 0.03]
    - [2025-12-08, [pipe, fitting], 0.02]
    - [2026-05-04, [pipe, fitting], -0.02]

production:
