    - [HWH, "Gangasagar Polymers Howrah Works", Howrah, West Bengal, tanks]
    - [DGP, "Gangasagar Polymers Durgapur Works", Durgapur, West Bengal, pipes_cpvc_and_tanks]
    - [GHY, "Gangasagar Polymers Guwahati Works", Guwahati, Assam, regional]
  lines:                           # plant, line_no, skus made on it
    - [HWH, 1, [GP-TNK-0200-3L, GP-TNK-0300-3L, GP-TNK-0500-3L, GP-TNK-0750-3L, GP-TNK-0500-4L]]
    - [HWH, 2, [GP-TNK-1000-3L, GP-TNK-1500-3L, GP-TNK-1000-4L]]
    - [HWH, 3, [GP-TNK-2000-3L, GP-TNK-3000-3L, GP-TNK-5000-3L, GP-TNK-2000-4L]]
    - [DGP, 1, [GP-PIP-UPV-20, GP-PIP-UPV-25, GP-PIP-UPV-32, GP-PIP-UPV-40, GP-PIP-CPV-15, GP-PIP-CPV-20, GP-PIP-CPV-25, GP-PIP-COL-32, GP-PIP-COL-40, GP-PIP-COL-50]]
    - [DGP, 2, [GP-TNK-0500-3L, GP-TNK-0750-3L, GP-TNK-1000-3L, GP-TNK-1500-3L, GP-TNK-2000-3L]]
    - [GHY, 1, [GP-TNK-0500-3L, GP-TNK-0750-3L, GP-TNK-1000-3L, GP-TNK-1500-3L, GP-TNK-2000-3L]]
    - [GHY, 2, [GP-FIT-CPV-ELB-20, GP-FIT-CPV-TEE-20, GP-FIT-CPV-MTA-25, GP-FIT-UPV-ELB-32, GP-FIT-UPV-TEE-32, GP-FIT-BLV-20, GP-FIT-BLV-25, GP-FIT-TCK-01]]
  fg_target_days: 14               # a batch tops its SKU's finished goods up to this many days of demand
  min_batch_units: {tank: 5, pipe: 100, fitting: 500}
  qc_pass_beta: [39, 1]            # mean 0.975
  resin_lot_weeks: [3, 8]
  dgp_line2_annual_units: 25000    # demand split: footprint distributors are served by Line 2 in this order until reached
  dgp_state_priority: [West Bengal, Jharkhand, Bihar, Odisha]
  howrah_hinterland: [Kolkata, Howrah, Hooghly, North 24 Parganas, South 24 Parganas, Nadia, Purba Medinipur]
  ghy_first_districts: [Jalpaiguri, Alipurduar, Cooch Behar]   # North Bengal accounts served Guwahati-first
  max_invoice_age_days: 33         # older tank stock is held back so ship_date <= mfg + 35
  shift_capacity: {HWH-1: 90, HWH-2: 90, HWH-3: 90, DGP-2: 47, GHY-1: 55}   # tank units per shift; Line 2 peaks at ~92/day
                                   # (ground truth resin_lot expected_units); Howrah covers Line 2 and Guwahati shortfalls

channel:
  target_cover_days: 30
  review_days: {1: [7], 2: [7, 14], 3: [14]}
  reorder_fraction: 0.35           # order only when the gap to target is >= this share of target
  safety_lots: {tank: 0, pipe: 1, fitting: 1, sanitaryware: 1}   # bulk goods add one retailer purchase lot of safety stock
  payment_terms_days: {1: 30, 2: 45, 3: 60}
  invoice_to_ship_days: [0, 2]
  credit_limit_inr: {1: [15000000, 30000000], 2: [4000000, 9000000], 3: [1000000, 3000000]}
  reporting:
    lag: {p80_days: 7, p97_days: 21, cap_days: 35, permanent_loss_share: 0.002}   # targets = ground truth
    late_week_probs: [0.82, 0.10, 0.045, 0.025, 0.01]   # extra whole weeks after the due upload, per record
    skipped_week_share: 0.03       # distributor-weeks skipped, then back-filled as catch-up records
    backfill_weeks: [1, 2]
    duplicate_upload_share: 0.005  # distributor-week uploads re-sent as exact duplicates
    duplicate_delay_days: [1, 5]
    sources:
      1: {dms_api: 0.7, excel_upload: 0.2, sales_app: 0.1}
      2: {dms_api: 0.4, excel_upload: 0.4, sales_app: 0.2}
      3: {dms_api: 0.1, excel_upload: 0.6, sales_app: 0.3}
  collections:
    late_median_days: 2
    late_profile_sd: 1.5
    chronic_share: 0.10
    chronic_median_days: 15
    chronic_profile_sd: 3
    invoice_sd_days: 3
    instalment_share: 0.15
    instalment_gap_days: [5, 15]
    first_instalment_share: [0.4, 0.6]
  visits:
    cadence_days: {1: 7, 2: 14, 3: 30}
    jitter_days: 2
    geofence_share: 0.92
    notes_share: 0.85
    notes:
      - "Routine visit; stock levels reviewed with the distributor."
      - "Discussed next order and delivery schedule."
      - "Payment follow-up on open invoices."
      - "Reviewed ongoing scheme and slab terms."
      - "Checked retailer coverage in the territory."
      - "Counter sales steady; no issues raised."
      - "Reminded distributor about weekly DMS uploads."
      - "Market feedback on pricing noted."
      - "Discussed upcoming price revision."
      - "Reviewed pending warranty cases."
      - "New retailer leads shared with the distributor."
      - "Godown checked; storage conditions fine."

entities:
