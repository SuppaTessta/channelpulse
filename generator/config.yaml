  natural_attrition_starts: [2024-06-03, 2025-01-13, 2025-11-10]   # demand falls to zero over attrition_days
  retailers: {per_distributor: {1: 60, 2: 30, 3: 15}, home_district_share: 0.8, in_window_share: 0.10, duplicate_name_share: 0.03, onboarded_from: 2010-01-01}
