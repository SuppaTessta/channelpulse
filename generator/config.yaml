  year1_per_month: {base_crack: 0.0020, leak: 0.00125, fitting_failure: 0.0010, discoloration: 0.0005, other: 0.00025}
  after_year1_factor: {base_crack: 0.02, leak: 0.05, fitting_failure: 0.05, discoloration: 0.05, other: 0.05}
  claim_after_failure_days: [0, 10]
  batch_frailty_cv: 0.15
  installer_frailty_cv: 0.15

claims:
  pending_within_days: 21
  approved_share: 0.88
  repair_cost_inr: [300, 2000]
  notes:
    base_crack: ["Crack observed at the base; unit replaced.", "Hairline crack along the base ring.", "Base cracked; seepage below the tank.", "Radial crack near the base; replacement issued."]
    leak: ["Seepage from the side wall; resealed.", "Minor leak along the moulding line.", "Leak near the outlet; sealant applied."]
    fitting_failure: ["Inlet fitting cracked; replaced.", "Outlet socket loose; refitted.", "Overflow fitting damaged; replaced."]
    discoloration: ["Surface discoloration on the exterior; cosmetic.", "Yellowing on the sun-facing side; cosmetic only."]
    other: ["Lid damaged; replaced.", "Inspected on complaint; no fault found.", "Lid lock broken; replaced."]

