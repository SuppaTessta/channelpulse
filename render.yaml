# Render blueprint for the API (build prompt step 8; decisions D25). The web app deploys to Vercel from web/, and the
# database is a Supabase project holding the marts schema, published nightly by .github/workflows/daily.yml.
services:
  - type: web
    name: channelpulse-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Least-privilege connection strings for the Supabase project (roles from api/sql/roles.sql), all through
      # Supabase's Session pooler: Render has no IPv6, and the free tier's direct host is IPv6-only. Pooler usernames
      # carry the project ref, e.g. channelpulse_agent.<ref> (docs/deploy-checklist.md).
      - key: DATABASE_URL          # used only by /health; point it at the agent role, not an admin
        sync: false
      - key: AGENT_DATABASE_URL
        sync: false
      - key: OPS_DATABASE_URL
        sync: false
      # The public demo answers live (decisions D55). Each visitor gets FREE_QUESTIONS_PER_DAY questions a UTC day on
      # the owner's key, until owner-paid spend reaches either cap; a visitor's own key counts toward none of them.
      # ASK_LIVE=0 switches live answers off and the Ask page goes back to replay.
      - key: ASK_LIVE
        value: "1"
      - key: ANTHROPIC_API_KEY     # the owner's key, from its own Anthropic workspace with a $10 monthly spend limit
        sync: false
      - key: DAILY_SPEND_CAP_USD
        value: "1.00"
      - key: MONTHLY_SPEND_CAP_USD
        value: "10.00"
      - key: FREE_QUESTIONS_PER_DAY
        value: "5"
      - key: VISITOR_SALT          # keys the daily visitor ids the free questions are counted by
        generateValue: true
      - key: CORS_ORIGINS          # the Vercel URL of the web app
        sync: false
      - key: TRUST_PROXY           # take the client IP from X-Forwarded-For for the rate limit and the visitor id
        value: "1"
      - key: ASK_RATE_PER_MIN
        value: "4"
