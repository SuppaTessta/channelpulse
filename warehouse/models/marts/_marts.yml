version: 2

# The marts schema is the only layer the agent and the dashboard may read (PLAN §6). Distributor-level marts carry a
# `region` column and a row-level-security policy keyed on the caller's region claim (macros/apply_region_rls.sql).
# Marts that carry governed metrics are documented, and tested, with their semantic definitions in ../../semantic_models/.

models:
  - name: dim_date
    description: Calendar with Indian fiscal (Apr–Mar) and ISO keys; the MetricFlow time spine.
    time_spine:
      standard_granularity_column: date_day
      # The Indian fiscal year (April to March) as metric_time grains, e.g. metric_time__fiscal_year = 'FY26' for
      # April 2025 to March 2026 (decisions D36). Calendar grains stay as they are: metric_time__year is Jan to Dec.
      custom_granularities:
        - name: fiscal_quarter
          column_name: fiscal_quarter_label
        - name: fiscal_year
          column_name: fiscal_year_label
    columns:
      - name: date_day
        granularity: day
        data_tests: [unique, not_null]
      - name: fiscal_quarter_label
        description: Indian fiscal quarter, e.g. FY27 Q1 for April to June 2026. The fiscal_quarter grain.
        data_tests: [not_null]
      - name: fiscal_year_label
        description: Indian fiscal year, e.g. FY27 for April 2026 to March 2027. The fiscal_year grain.
        data_tests: [not_null]

  - name: fct_channel_inventory_daily
    description: >-
      Implied channel stock per distributor × sku × day (PLAN §6), the detail behind the governed inventory
      metrics, which are served from mart_channel_inventory_weekly (decisions D24). RLS by region (via the distributor).
    data_tests:
      - unique:
          arguments:
            column_name: "distributor_id || '|' || sku || '|' || date_day"

  - name: dim_geo
    description: Pincode → district → state → sales region (decisions D4).
    columns:
      - name: pincode
        data_tests: [unique, not_null]
      - name: region
        data_tests: [not_null]
